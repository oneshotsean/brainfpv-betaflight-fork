name: Build RADIX2HD

on:
  workflow_dispatch:
  push:
    branches: [radix2hd]
  pull_request:
    branches: [radix2hd]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install BrainFPV packer
        run: pip install https://github.com/BrainFPV/brainfpv_fw_packer/archive/main.zip

      - name: Install ARM toolchain
        run: make arm_sdk_install

      - name: Build and pack
        run: make brainfpv_bin TARGET=RADIX2HD

      # Nothing here can be tested on hardware, so at least assert the two
      # things the bootloader depends on: the image is linked for the RAM
      # address it loads to, and it carries the header identifying this board.
      - name: Check bootloader image layout
        run: |
          set -euo pipefail
          OBJDUMP=$(find tools -name 'arm-none-eabi-objdump' -type f | head -1)
          if [ -z "$OBJDUMP" ]; then
            echo "::error::arm-none-eabi-objdump not found under tools/"
            exit 1
          fi
          ELF=obj/main/betaflight_RADIX2HD.elf

          echo "--- sections ---"
          "$OBJDUMP" -h "$ELF"

          VECTOR_VMA=$("$OBJDUMP" -h "$ELF" | awk '$2 == ".isr_vector" { print $4 }')
          if [ "$VECTOR_VMA" != "24000000" ]; then
            echo "::error::.isr_vector is at 0x$VECTOR_VMA, expected 0x24000000 (the address the BrainFPV bootloader loads to and jumps into)"
            exit 1
          fi
          echo "OK: .isr_vector at 0x$VECTOR_VMA"

          if ! "$OBJDUMP" -x "$ELF" | grep -q BRAINFPV_BL_HEADER; then
            echo "::error::BRAINFPV_BL_HEADER missing - the bootloader would reject this image"
            exit 1
          fi
          echo "OK: bootloader header present at 0x$("$OBJDUMP" -x "$ELF" | grep BRAINFPV_BL_HEADER | cut -d' ' -f1)"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: betaflight-radix2hd
          path: |
            obj/*_brainfpv.bin
            obj/*.hex
            obj/main/*.elf
          if-no-files-found: error
